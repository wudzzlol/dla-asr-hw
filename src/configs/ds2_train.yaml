defaults:
  - model: deepspeech2_full
  - writer: cometml
  - metrics: example
  - datasets: librispeech_train
  - dataloader: gpu
  - transforms: asr
  - _self_
optimizer:
  _target_: torch.optim.AdamW
  lr: 3e-4
lr_scheduler:
  _target_: torch.optim.lr_scheduler.OneCycleLR
  max_lr: 1e-3
  pct_start: 0.1
  steps_per_epoch: ${trainer.epoch_len}
  epochs: ${trainer.n_epochs}
  anneal_strategy: cos
loss_function:
  _target_: src.loss.CTCLossWrapper
text_encoder:
  _target_: src.text_encoder.CTCTextEncoder
writer:
  project_name: "asr_hw"
  run_name: "ds2_full"
trainer:
  log_step: 100
  n_epochs: 40
  epoch_len: 1000
  device_tensors: ["spectrogram", "text_encoded"]
  resume_from: null
  device: auto
  override: False
  monitor: "min val_WER_(Argmax)"
  save_period: 1
  early_stop: ${trainer.n_epochs}
  save_dir: "saved"
  seed: 1
  max_grad_norm: 10
