train:
  get_spectrogram: # special key for getting spectrogram
    _target_: torchaudio.transforms.MelSpectrogram
    sample_rate: 16000
  audio: # name of the tensor on which we apply transform
    _target_: torchvision.transforms.v2.Compose
    transforms:
      - _target_: src.transforms.wav_augs.Gain
        min_gain_in_db: -6.0
        max_gain_in_db: 6.0
        p: 0.5
        output_type: tensor
      - _target_: src.transforms.wav_augs.ColoredNoise
        sample_rate: 16000
        min_snr_in_db: 15.0
        max_snr_in_db: 30.0
        p: 0.4
        output_type: tensor
      - _target_: src.transforms.wav_augs.SpeedPerturbation
        orig_freq: 16000
        factors: [0.9, 1.0, 1.1]
inference:
  get_spectrogram:
    _target_: torchaudio.transforms.MelSpectrogram
    sample_rate: 16000
